<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile Not Available</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: white;
            padding: 45px 30px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.10);
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #fee2e2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        p {
            color: #64748b;
            line-height: 1.6;
            font-size: 16px;
        }

        .brand {
            margin-top: 30px;
            color: #0f766e;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">
            🔒
        </div>

        <h1>
            Profile Not Available
        </h1>

        <p>
            This career profile is no longer available
            or the student has disabled profile sharing.
        </p>

        <div class="brand">
            🤖 AI Career Coach
        </div>

    </div>

</body>
</html>
